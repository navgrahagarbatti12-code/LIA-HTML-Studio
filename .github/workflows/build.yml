
name: Build LIA HTML Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LIA HTML Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          test -f LIA_HTML_Studio_Updated_v2.1.0.zip
          mkdir -p source
          unzip -q LIA_HTML_Studio_Updated_v2.1.0.zip -d source
          test -f source/LIA_HTML_Studio/settings.gradle.kts
          test -f source/LIA_HTML_Studio/app/build.gradle.kts
          echo "Project extracted successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify SDK
        run: |
          adb version
          sdkmanager --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: source/LIA_HTML_Studio
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK="source/LIA_HTML_Studio/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIA-HTML-Studio-debug
          path: source/LIA_HTML_Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
